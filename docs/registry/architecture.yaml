# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: multiplayer_framework
    status: active
    api: "Netcode for GameObjects + Unity Transport (버전은 6000.6.8f1 컴파일 검증 후 고정)"
    not: "Mirror, UNet, 직접 소켓"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    reason: "공식 프레임워크이며 엔진 참조 문서 기준"
    referenced_by:
      - docs/architecture/adr-0001-multiplayer-networking-architecture.md
      - docs/architecture/adr-0002-session-join-method.md
    added: 2026-11-21
    revised: ""
  - purpose: server_process
    status: active
    api: "Dedicated Server 빌드를 호스트 클라이언트가 자식 프로세스로 기동, 호스트는 loopback 접속"
    not: "StartHost(호스트 프로세스 안 서버)"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    reason: "GDD networking 규칙 1(분리 실행, 호스트도 클라이언트)"
