    added: 2026-11-21
    revised: ""
  - contract: client_requests
    status: active
    pattern: rpc
    producer: client
    consumers:
      - networking-server
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    signal_signature: "상차 시작·중단, 하차, 처분, 준비·취소, 하루 시작(호스트 clientId만). 결과는 복제 상태로 수신"
