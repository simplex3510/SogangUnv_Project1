# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: domain_logic_netcode_reference
    status: active
    description: "도메인 규칙 클래스(시계·배정·마감·충돌 판정·정산)는 Unity.Netcode를 참조하지 않는다. NetworkBehaviour 어댑터만 참조한다"
    why: "도메인 규칙을 네트워크 없이 단위 테스트하고 싱글·멀티 규칙을 하나로 유지하기 위해"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: client_shared_state_write
    status: active
    description: "클라이언트가 공유 상태(세션·물류·시계·차량 물리)를 직접 쓰지 않는다. 서버 요청 RPC만 쓴다"
    why: "서버가 유일한 기준(GDD networking 규칙 2)"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: networkmanager_singleton_outside_adapter
    status: active
    description: "NetworkManager.Singleton은 네트워크 어댑터 계층 밖에서 쓰지 않는다. 필요한 값은 주입한다"
    why: "싱글턴 결합은 테스트를 막는다(coding-standards: 의존성 주입)"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: static_mutable_state
    status: active
    description: "static 가변 상태를 두지 않는다. 불가피하면 RuntimeInitializeOnLoadMethod(SubsystemRegistration)에서 초기화한다"
    why: "6.6 Play Mode 도메인 리로드 생략 시 Play 세션 간 상태가 남는다"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: unity_services_outside_adapter
    status: active
    description: "Unity.Services.* 참조는 네트워크 어댑터 어셈블리에만 둔다. 도메인 규칙·UI는 참조하지 않는다"
    why: "참가 업체 교체·추가 시 영향 범위를 어댑터로 한정"
    adr: docs/architecture/adr-0002-session-join-method.md
    added: 2026-11-21
  - pattern: predicted_state_judgement
    status: active
    description: "소유 클라이언트의 예측 차량 결과(충돌·트리거·위치)로 내구도·물류·장애물 효과 등 도메인 상태를 바꾸거나 서버로 보내지 않는다. 판정과 충돌 연출은 서버 결과로만 한다"
    why: "예측은 표시용이며 서버가 유일한 기준(GDD 규칙 2·7). 재시뮬레이션은 같은 스텝을 여러 번 실행한다"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: network_callback_direct_domain_write
    status: active
    description: "NGO 접속·끊김 콜백과 요청 RPC 핸들러에서 도메인 상태를 바로 바꾸지 않는다. 서버 어댑터 큐에 넣고 서버 틱 순서로 반영한다"
    why: "같은 스텝 이벤트의 처리 순서(이탈 우선)를 보장하기 위해"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: vehicle_step_external_read
    status: active
    description: "차량 스텝 함수는 VehicleInput·VehicleSimState 외의 값(static, 싱글턴, GetComponent)을 읽지 않는다"
    why: "서버와 예측 차량이 같은 입력으로 같은 결과를 내야 재조정이 성립한다"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21
  - pattern: game_pause
    status: active
    description: "게임 시간·물리를 멈추는 정지 기능(GameManager.IsPaused 등)을 두지 않는다. 싱글도 같다"
    why: "서버 시계만 진행하고 싱글·멀티 규칙이 같아야 한다(GDD 3.2, networking 규칙 3)"
    adr: docs/architecture/adr-0001-multiplayer-networking-architecture.md
    added: 2026-11-21

